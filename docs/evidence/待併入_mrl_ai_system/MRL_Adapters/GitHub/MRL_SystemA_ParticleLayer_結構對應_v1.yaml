# ═══════════════════════════════════════════════════════════════════
# 第一層｜粒子結構定義 ↔ UnifiedParticle
# ═══════════════════════════════════════════════════════════════════
第一層_粒子結構:
  母體來源: "MRL_WorldModel/MRL_FlowRhythm_v0/lexicon/下載 EchoPersona.structure.json"
  母體結構: "persona（字串）＋ sequence[]（每項四欄：code / type / meaning / pcode）"
  鏡像來源: "Mrliou/mrliouword-system modules/MRL_SystemA_ParticleLayer/unified_particle.py"

  欄位對照:
    - structure_json欄: "persona"
      例: "Echo.Persona"
      對應: "UnifiedParticle.persona_id"
      鏡像行: "unified_particle.py:23"
    - structure_json欄: "code"
      例: "⋄fx.adj.112"
      對應: "UnifiedParticle.tags"
      鏡像行: "unified_particle.py:33"
    - structure_json欄: "type"
      例: "adjective"
      對應: "UnifiedParticle.domain"
      鏡像行: "unified_particle.py:27"
    - structure_json欄: "meaning"
      例: "內省"
      對應: "UnifiedParticle.state"
      鏡像行: "unified_particle.py:28"
    - structure_json欄: "pcode"
      例: "MOV P1, FX.ADJ.112"
      對應: "UnifiedParticle.state"
      鏡像行: "unified_particle.py:28"
    - structure_json欄: "（軌跡檔路徑，不在 structure.json 內）"
      例: "MRL_WorldModel/MRL_FlowRhythm_v0/traces/EchoPersona.trace.fltnz"
      對應: "UnifiedParticle.fltnz_path"
      鏡像行: "unified_particle.py:26"
      註: >
        **這個欄位本來就存在**，不是本次新增。粒子層與 FlowRhythm 軌跡之間的
        銜接槽早就設計好了，本對照表只是把結構定義對上去。

  EchoPersona_五顆粒子逐條:
    - code: "⋄fx.adj.112"
      type: "adjective"
      meaning: "內省"
      pcode: "MOV P1, FX.ADJ.112"
      軌跡動詞: "resonance"
      軌跡行: "EchoPersona.trace.fltnz:4"
      map行: "EchoPersona.trace.fltnz:10（⌬map[FX.ADJ.112]↦⋄fx.adj.112）"
      語義狀態: "PROVISIONAL_NOT_CANONICAL"
    - code: "⋄fx.noun.024"
      type: "noun"
      meaning: "記憶/節點"
      pcode: "MOV P2, FX.NOUN.024"
      軌跡動詞: "absorb"
      軌跡行: "EchoPersona.trace.fltnz:5"
      map行: "EchoPersona.trace.fltnz:11"
      語義狀態: "PROVISIONAL_NOT_CANONICAL"
    - code: "∴"
      type: "logic"
      meaning: "因果連接"
      pcode: "JMP FLYNZ.CAUSE"
      軌跡動詞: "jump"
      軌跡行: "EchoPersona.trace.fltnz:6"
      map行: "EchoPersona.trace.fltnz:12（⌬map[FLYNZ.CAUSE]↦∴）"
      語義狀態: "PROVISIONAL_NOT_CANONICAL"
      節奏段: "Jump —— 邏輯跳點，觸發因果連接"
    - code: "⋄fx.flow.007"
      type: "verb"
      meaning: "封存/導出"
      pcode: "CALL FX.FLOW.007"
      軌跡動詞: "collapse"
      軌跡行: "EchoPersona.trace.fltnz:7（帶封包雜湊 #0ca3cd2da67d6e11）"
      map行: "EchoPersona.trace.fltnz:13"
      語義狀態: "PROVISIONAL_NOT_CANONICAL"
      節奏段: "Collapse —— 行為執行，把當下語場折疊成種子封包（SHA-256）"
    - code: "⊗Memory.SelfReflect"
      type: "target"
      meaning: "自我反思模組"
      pcode: "STORE R0, MEM.SELF_REFLECT"
      軌跡動詞: "trace"
      軌跡行: "EchoPersona.trace.fltnz:8"
      map行: "EchoPersona.trace.fltnz:14"
      語義狀態: "PROVISIONAL_NOT_CANONICAL"

  核心粒子_不在sequence內:
    code: "⊕Core: Echo.Persona"
    type: "core"
    軌跡動詞: "initiated"
    軌跡行: "EchoPersona.trace.fltnz:3"
    語義狀態: "VERIFIED"
    註: "這是目前**唯一**已核准的映射，見下方語義狀態一節"

  pcode欄的比對形式:
    發現: >
      structure.json 的 pcode 欄與 .pcode 檔的行**不是逐位元組相同**。
      .pcode 用多個空白對齊（例 `MOV    P1, FX.ADJ.112         ; 內省`），
      structure.json 寫成單一空白（`MOV P1, FX.ADJ.112`）且不帶 `;` 註解。
    實測: "收合連續空白並去掉 `;` 之後的註解，五條全部對上（✓×5）"
    結論: "pcode 欄是 .pcode 行的**空白收合形**，比對時必須正規化，不可用字串相等"

  sequence的覆蓋範圍:
    pcode的op數: 8（第 1 行是 `;` 註解，不算 op）
    sequence覆蓋: 5
    未被sequence覆蓋的三個op:
      - op: "LOAD   P0, CORE.ECHO.PERSONA（.pcode:2）"
        說明: >
          對應核心粒子 `⊕Core: Echo.Persona`，它**在軌跡裡**
          （EchoPersona.trace.fltnz:3，動詞 ::initiated，語義狀態 VERIFIED），
          但不在 structure.json 的 sequence 內。
        狀態: "已對上原始檔（在軌跡，不在 sequence）"
      - op: "PUSH   P1（.pcode:4）"
        狀態: "待找回"
      - op: "PUSH   P2（.pcode:6）"
        狀態: "待找回"
    待找回的說明: >
      兩個 PUSH 在 structure.json 的 sequence 與 trace 的 ::verb→ 兩邊都沒有
      對應粒子。依《局部視角不得升格全局權威》，標「待找回」，
      **不標「不存在」**，也不自行補一個映射上去。

  節奏鏈_原文:
    行: "EchoPersona.trace.fltnz:9"
    內容: "⋄fx.adj.112 → ⋄fx.noun.024 → ∴ → ⋄fx.flow.007 → ⊗Memory.SelfReflect"
    說明: "此為 Coupling 線；加上 ::verb→（Trace 線）與 ⌬map（Map 線），軌跡同時接上三種線"

