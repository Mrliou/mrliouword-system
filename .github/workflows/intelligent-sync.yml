name: Intelligent GitHub Sync

on:
  # Weekly schedule (Monday at 00:00 UTC)
  schedule:
    - cron: '0 0 * * 1'
  
  # Manual trigger with pattern selection
  workflow_dispatch:
    inputs:
      pattern:
        description: 'Search pattern (leave empty for all patterns)'
        required: false
        type: string
      limit:
        description: 'Maximum results per pattern'
        required: false
        type: number
        default: 30
      run_tests:
        description: 'Run the standalone particle test report'
        required: false
        type: boolean
        default: true

jobs:
  intelligent-sync:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      actions: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml numpy pytest pytest-asyncio
      
      - name: Verify core modules
        run: |
          python -c "from core.simhash64 import simhash64; print('✓ simhash64')"
          python -c "from core.merkle import MerkleChain; print('✓ merkle')"
      
      - name: Verify intelligent sync contracts
        run: python -m pytest -q tests/test_intelligent_sync.py

      - name: Run intelligent sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATTERN: ${{ inputs.pattern }}
          LIMIT: ${{ github.event.inputs.limit || '30' }}
        run: |
          if [[ ! "$LIMIT" =~ ^([1-9][0-9]?|100)$ ]]; then
            echo "Invalid limit input. Only integers between 1 and 100 are allowed."
            exit 1
          fi

          PATTERN_RE='^[A-Za-z0-9_.:/ -]*$'
          if [[ -n "$PATTERN" && ! "$PATTERN" =~ $PATTERN_RE ]]; then
            echo "Invalid pattern input. Only letters, digits, space, '.', '_', '-', '/', and ':' are allowed."
            exit 1
          fi

          if [ -n "$PATTERN" ]; then
            # Sync specific pattern
            python scripts/intelligent_repo_sync.py \
              --config intelligent_sync.yaml \
              --pattern "$PATTERN" \
              --limit "$LIMIT"
          else
            # Sync all patterns
            python scripts/intelligent_repo_sync.py \
              --config intelligent_sync.yaml \
              --all \
              --limit "$LIMIT"
          fi
      
      - name: Run particle tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/integrations/particle/test_recorder.py"

      - name: Generate summary report
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Intelligent Sync Report"
            echo "**Storage:** Candidate particles · Owner review pending"
            echo ""
            shopt -s nullglob
            reports=(sync_candidates/run-*/sync_reports/*.json)
            if (( ${#reports[@]} == 0 )); then
              echo "No sync reports found"
            fi
            for report in "${reports[@]}"; do
              python scripts/generate_summary.py "$report"
              echo ""
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sync reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: sync-reports-${{ github.run_number }}
          path: |
            sync_candidates/run-*/sync_reports/
            sync_candidates/run-*/test_results/*/report.json
            sync_candidates/run-*/naming_history/
            sync_candidates/run-*/particle_memory/
          retention-days: 90

      - name: Notification on failure
        if: failure()
        run: |
          echo "::error::Intelligent Sync failed. Check logs for details."
          
          # Create issue on failure (optional)
          # gh issue create --title "Intelligent Sync Failed" --body "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
