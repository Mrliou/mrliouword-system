name: MRL public interface artifact attestation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - MRL_Wake_Public_Interface_v1/**
      - .github/workflows/generator-generic-ossf-slsa3-publish.yml
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-attest:
    name: Build and attest MRL Wake public interface
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      artifact: ${{ steps.build.outputs.artifact }}

    steps:
      - name: Check out the release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate public interface sources
        shell: bash
        run: |
          set -euo pipefail
          test -f MRL_Wake_Public_Interface_v1/schema/Mrliou_MRL_Wake_Manifest_Public_Interface_v1.schema.json
          test -f MRL_Wake_Public_Interface_v1/scripts/Mrliou_MRL_Verify_Wake_Public_Interface_v1.mjs
          node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" \
            MRL_Wake_Public_Interface_v1/schema/Mrliou_MRL_Wake_Manifest_Public_Interface_v1.schema.json
          node MRL_Wake_Public_Interface_v1/scripts/Mrliou_MRL_Verify_Wake_Public_Interface_v1.mjs

      - name: Build deterministic public interface archive
        id: build
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "release" ]]; then
            version="$(printf '%s' "${RELEASE_TAG}" | tr -c 'A-Za-z0-9._-' '_')"
          else
            version="sha-${GITHUB_SHA:0:12}"
          fi

          artifact="MRL_Wake_Public_Interface_v1-${version}.tar.gz"
          staging="dist/staging"
          mkdir -p "${staging}/MRL_Wake_Public_Interface_v1"
          cp -a MRL_Wake_Public_Interface_v1/schema "${staging}/MRL_Wake_Public_Interface_v1/"
          cp -a MRL_Wake_Public_Interface_v1/scripts "${staging}/MRL_Wake_Public_Interface_v1/"

          SOURCE_COMMIT="${GITHUB_SHA}" WORKFLOW_COMMIT="${GITHUB_WORKFLOW_SHA}" \
          node <<'NODE' > "${staging}/MRL_Wake_Public_Interface_v1/PROVENANCE-MANIFEST.json"
          const manifest = {
            schema_version: "1.0.0",
            artifact_name: "MRL_Wake_Public_Interface_v1",
            artifact_role: "PUBLIC_INTERFACE_PACKAGE",
            canonical_authority: "Mr.liou / MrLiouWord",
            source_repository: "https://github.com/Mrliou/mrliouword-system",
            source_commit: process.env.SOURCE_COMMIT,
            build_workflow: ".github/workflows/generator-generic-ossf-slsa3-publish.yml",
            build_workflow_commit: process.env.WORKFLOW_COMMIT,
            included_paths: [
              "MRL_Wake_Public_Interface_v1/schema",
              "MRL_Wake_Public_Interface_v1/scripts"
            ],
            excluded_products: ["MRL-APIWORKS-BYOH-DEPLOY-V1"],
            verification_policy: "VERIFY_WITH_GITHUB_ARTIFACT_ATTESTATION",
            origin_signature: "MrLiouWord"
          };
          process.stdout.write(JSON.stringify(manifest, null, 2) + "\n");
          NODE

          (
            cd "${staging}/MRL_Wake_Public_Interface_v1"
            find PROVENANCE-MANIFEST.json schema scripts -type f -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )

          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "${GITHUB_SHA}")"
          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" \
            --owner=0 --group=0 --numeric-owner \
            -C "${staging}" -cf - MRL_Wake_Public_Interface_v1 \
            | gzip -n > "dist/${artifact}"
          (
            cd dist
            sha256sum "${artifact}" > "${artifact}.sha256"
          )

          echo "artifact=${artifact}" >> "${GITHUB_OUTPUT}"

      - name: Generate GitHub build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ steps.build.outputs.artifact }}

      - name: Upload attested build outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.build.outputs.artifact }}
          path: |
            dist/${{ steps.build.outputs.artifact }}
            dist/${{ steps.build.outputs.artifact }}.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Print verification command
        shell: bash
        env:
          ARTIFACT: ${{ steps.build.outputs.artifact }}
        run: |
          printf '%s\n' \
            "gh attestation verify ${ARTIFACT} -R Mrliou/mrliouword-system"

  publish-release-assets:
    name: Attach attested outputs to published release
    if: github.event_name == 'release'
    needs: build-and-attest
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download attested build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-and-attest.outputs.artifact }}
          path: dist

      - name: Attach outputs to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ARTIFACT: ${{ needs.build-and-attest.outputs.artifact }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" \
            "dist/${ARTIFACT}" \
            "dist/${ARTIFACT}.sha256" \
            --clobber
