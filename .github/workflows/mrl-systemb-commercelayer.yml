name: MRL SystemB CommerceLayer

on:
  push:
    paths:
      - 'modules/MRL_SystemB_CommerceLayer/**'
      # 本層依賴 SystemA 的 Identity / Provenance，所以 SystemA 一動就要重驗
      - 'modules/MRL_SystemA_ParticleLayer/**'
      - 'registry/patterns/mrl_MRL_System*.yaml'
      # 階段門在執行期從這個檔讀 network_phase，所以它一動就要跑階段測試：
      # 改 Phase 1→2、改鍵名格式、或任何讓解析失敗的編輯，都必須被這裡攔到。
      - 'registry/system_registry.yaml'
      - '.github/workflows/mrl-systemb-commercelayer.yml'
  pull_request:
    paths:
      - 'modules/MRL_SystemB_CommerceLayer/**'
      - 'modules/MRL_SystemA_ParticleLayer/**'
      - 'registry/patterns/mrl_MRL_System*.yaml'
      # 階段門在執行期從這個檔讀 network_phase，所以它一動就要跑階段測試：
      # 改 Phase 1→2、改鍵名格式、或任何讓解析失敗的編輯，都必須被這裡攔到。
      - 'registry/system_registry.yaml'
      - '.github/workflows/mrl-systemb-commercelayer.yml'

jobs:
  commerce-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 先在完全沒有第三方套件的環境跑一次，證明零依賴的宣稱是真的
      - name: Verify without any dependency installed
        run: python modules/MRL_SystemB_CommerceLayer/tests/test_commerce_layer.py

      - name: Verify package import from repo root
        run: |
          python -m compileall -q modules/MRL_SystemB_CommerceLayer
          python -c "import modules.MRL_SystemB_CommerceLayer as b; print(len(b.__all__))"

      # stable_locked 的兩份規章不得被本層改動。
      # 刻意不用 git diff 比 base ref：actions/checkout 預設淺層，抓不到該 ref
      # 會讓 CI 因為無關的理由變紅。這裡直接檢查內容不變式。
      - name: Assert locked registry invariants hold
        run: |
          python - <<'PY'
          import pathlib, sys
          checks = {
              "registry/system_registry.yaml": [
                  'status: "stable_locked"',
                  'system_brand: "MRL"',
                  'origin_signature: "MrLiouWord"',
                  'network_phase: "PHASE1_PRIVATE_LAN_ONLY"',
              ],
              "registry/rules/naming_rules_v1.yaml": [
                  'status: "stable_locked"',
                  'origin_signature: "MrLiouWord"',
                  'registry_key_format: "mrl_<OriginalName>"',
                  '"Original names are NEVER changed"',
              ],
          }
          failed = False
          for path, needles in checks.items():
              text = pathlib.Path(path).read_text(encoding="utf-8")
              for needle in needles:
                  if needle not in text:
                      print(f"MISSING in {path}: {needle}")
                      failed = True
          sys.exit(1 if failed else 0)
          PY

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Verify grants, metering and report honesty
        working-directory: modules/MRL_SystemB_CommerceLayer
        run: pytest -q
