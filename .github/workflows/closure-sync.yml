name: 🔄 Closure Sync - 閉環同步

on:
  push:
    branches: [main]
    paths:
      - 'core/particles/**'
      - 'docs/particle-dictionary/**'
      - '.mrliou/**'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sync mode'
        required: false
        default: 'observe'
        type: choice
        options: [observe, verify, full]
      dry_run:
        description: 'Dry run (no repository writes)'
        required: false
        type: boolean
        default: true

concurrency:
  group: closure-sync-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  SOURCE_REPOSITORY: ${{ github.repository }}
  TARGET_REPOSITORY_1: ${{ vars.MRL_SYNC_TARGET_1 }}
  TARGET_REPOSITORY_2: ${{ vars.MRL_SYNC_TARGET_2 }}
  ALLOWED_OWNER: ${{ vars.MRL_SYNC_ALLOWED_OWNER || github.repository_owner }}
  MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'observe' }}
  APPLY_CHANGES: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'full' && inputs.dry_run == false }}
  CANDIDATE_BRANCH: Mrliou_MRL_closure_sync/${{ github.run_id }}

jobs:
  sync-consistency:
    name: 跨倉庫一致性同步
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read

    steps:
      - name: Validate authority and routes
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$SOURCE_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Source must be the repository running this workflow"
            exit 1
          fi
          if [ -z "$TARGET_REPOSITORY_1" ]; then
            echo "::error::MRL_SYNC_TARGET_1 must name an explicitly approved MRL repository"
            exit 1
          fi
          for repository in "$TARGET_REPOSITORY_1" "$TARGET_REPOSITORY_2"; do
            [ -z "$repository" ] && continue
            case "$repository" in
              "$ALLOWED_OWNER"/*) ;;
              *) echo "::error::Unapproved repository owner: $repository"; exit 1 ;;
            esac
          done
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::SYNC_TOKEN is required for explicit cross-repository access"
            exit 1
          fi
          echo "source=$SOURCE_REPOSITORY"
          echo "target_1=$TARGET_REPOSITORY_1"
          echo "target_2=${TARGET_REPOSITORY_2:-<none>}"
          echo "allowed_owner=$ALLOWED_OWNER"
          echo "mode=$MODE"
          echo "apply_changes=$APPLY_CHANGES"

      - name: Checkout authoritative source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          path: source
          token: ${{ secrets.SYNC_TOKEN }}
          fetch-depth: 0

      - name: Checkout approved target 1
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPOSITORY_1 }}
          path: target1
          token: ${{ secrets.SYNC_TOKEN }}
          fetch-depth: 0

      - name: Checkout approved target 2
        if: ${{ env.TARGET_REPOSITORY_2 != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPOSITORY_2 }}
          path: target2
          token: ${{ secrets.SYNC_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check cryptography gitpython

      - name: Build deterministic source Merkle tree
        run: python source/tools/merkle_builder.py source source/.mrliou/merkle.json

      - name: Run source-authoritative closure plan
        run: |
          set -euo pipefail
          targets="target1"
          if [ -d target2 ]; then targets="$targets,target2"; fi
          command=(python source/tools/sync_manager.py --source source --targets "$targets" --mode "$MODE" --report source/.mrliou/sync_report.json)
          if [ "$APPLY_CHANGES" = "true" ]; then
            command+=(--auto-heal)
          else
            command+=(--dry-run)
          fi
          "${command[@]}"

      - name: Verify all declared repositories
        run: |
          set -euo pipefail
          repos=(source target1)
          if [ -d target2 ]; then repos+=(target2); fi
          python source/tools/verify_consistency.py "${repos[@]}" --check-merkle --cross-repo --output source/.mrliou/verification_report.json

      - name: Generate report with actual targets
        if: always()
        run: |
          set -euo pipefail
          targets="target1"
          if [ -d target2 ]; then targets="$targets,target2"; fi
          python source/tools/generate_sync_report.py --source source --targets "$targets" --output source/.mrliou/final_sync_report.json

      - name: Record truthful health status
        if: ${{ success() && env.APPLY_CHANGES == 'true' }}
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          verification = json.loads(Path('source/.mrliou/verification_report.json').read_text())
          health = {
              'last_sync': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'status': 'healthy' if verification.get('consistent') else 'unhealthy',
              'source_repository': '${{ env.SOURCE_REPOSITORY }}',
              'target_repositories': [
                  value for value in [
                      '${{ env.TARGET_REPOSITORY_1 }}',
                      '${{ env.TARGET_REPOSITORY_2 }}',
                  ] if value
              ],
              'verification': verification,
              'issues': [] if verification.get('consistent') else verification.get('mismatches', []),
          }
          Path('source/.mrliou/health.json').write_text(json.dumps(health, indent=2, ensure_ascii=False) + '\n')
          PY

      - name: Commit source evidence to candidate branch
        if: ${{ success() && env.APPLY_CHANGES == 'true' }}
        working-directory: source
        run: |
          set -euo pipefail
          git config user.name "MrLiouWord Sync Bot"
          git config user.email "sync@mrliouword.system"
          git add .mrliou/merkle.json .mrliou/health.json .mrliou/sync_report.json .mrliou/verification_report.json .mrliou/final_sync_report.json
          if ! git diff --staged --quiet; then
            git commit -m "🔄 [Closure Sync] Record verified MRL sync evidence"
            git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          fi

      - name: Commit approved target 1 changes to candidate branch
        if: ${{ success() && env.APPLY_CHANGES == 'true' }}
        working-directory: target1
        run: |
          set -euo pipefail
          git config user.name "MrLiouWord Sync Bot"
          git config user.email "sync@mrliouword.system"
          git add core/particles docs/particle-dictionary .mrliou
          if ! git diff --staged --quiet; then
            git commit -m "🔄 [Closure Sync] Apply verified MRL source state"
            git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          fi

      - name: Commit approved target 2 changes to candidate branch
        if: ${{ success() && env.APPLY_CHANGES == 'true' && env.TARGET_REPOSITORY_2 != '' }}
        working-directory: target2
        run: |
          set -euo pipefail
          git config user.name "MrLiouWord Sync Bot"
          git config user.email "sync@mrliouword.system"
          git add core/particles docs/particle-dictionary .mrliou
          if ! git diff --staged --quiet; then
            git commit -m "🔄 [Closure Sync] Apply verified MRL source state"
            git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-report-${{ github.run_number }}
          path: |
            source/.mrliou/merkle.json
            source/.mrliou/sync_report.json
            source/.mrliou/verification_report.json
            source/.mrliou/final_sync_report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Create evidence-based summary
        if: always()
        run: |
          {
            echo "## Closure Sync Report"
            echo ""
            echo "- Source: \`$SOURCE_REPOSITORY\`"
            echo "- Target 1: \`$TARGET_REPOSITORY_1\`"
            echo "- Target 2: \`${TARGET_REPOSITORY_2:-none}\`"
            echo "- Mode: \`$MODE\`"
            echo "- Apply changes: \`$APPLY_CHANGES\`"
            echo "- Candidate branch: \`$CANDIDATE_BRANCH\`"
            if [ -f source/.mrliou/verification_report.json ]; then
              python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('source/.mrliou/verification_report.json').read_text())
          print(f"- Verified consistent: \`{str(bool(data.get('consistent'))).lower()}\`")
          print(f"- Mismatches: \`{len(data.get('mismatches', []))}\`")
          PY
            else
              echo "- Verified consistent: \`false\`"
              echo "- Verification report: \`missing\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
