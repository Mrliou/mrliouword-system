name: Deploy MrLiouWord System

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy-cloudflare:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Wrangler
        run: npm install -g wrangler
      
      - name: Deploy mrliouword-private
        working-directory: cloudflare/mrliouword-private
        run: |
          npm install
          wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  sync-notion:
    name: Sync to Notion
    runs-on: ubuntu-latest
    needs: deploy-cloudflare
    if: always() && github.event_name == 'workflow_dispatch' && secrets.NOTION_TOKEN != ''
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install notion-client
      
      - name: Sync particle dictionary
        working-directory: integrations/notion
        run: python sync.py --sync-dict
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

  generate-docs:
    name: Generate Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Generate index
        run: |
          echo "# MrLiouWord System Status" > docs/STATUS.md
          echo "" >> docs/STATUS.md
          echo "Last updated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> docs/STATUS.md
          echo "" >> docs/STATUS.md
          echo "## Deployed Components" >> docs/STATUS.md
          echo "- mrliouword-private: ✅" >> docs/STATUS.md
          echo "- particle-auth-gateway: ✅" >> docs/STATUS.md
      
      - name: Commit docs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-update system status"
          file_pattern: "docs/*.md"
