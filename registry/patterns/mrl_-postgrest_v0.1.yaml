  own_commits: 0
  own_commits_evidence: >
    `git merge-base --is-ancestor c35eb7a upstream/main` → TRUE，確認 fork 的
    main 尖端是上游 main 的祖先（上游 main 當時為 c042567）；加上只有 main
    一條分支、零 tag，故無任何自有內容。
  own_commits_evidence_method_note: >
    2026-10-17 訂正方法。本欄原先只用 `git fetch upstream <sha>` 取得成功當
    證據，那不足：upload-pack 能供應某個物件，只證明它在該倉庫的物件庫裡，
    而 GitHub 的 fork network **共用物件庫**，所以一個只存在於 fork 的 head
    也可能被上游的 upload-pack 供應出來，會把 fork 自有的 commit 誤判成上游的。
    改用 `git fetch --depth 2000 upstream main` 取得上游真實 ref 後，再做
    merge-base 可達性檢查。結論未變，證據強度變了。
  created_at: "2026-02-03T06:23:19Z"
  pushed_at: "2026-02-02T23:45:00Z"
  pushed_before_created: true
  pushed_before_created_note: >
    pushed_at 早於 created_at，是 fork 建立後從未被推送過的特徵
    ——該欄在建立時承襲上游最後一次推送的時間。
